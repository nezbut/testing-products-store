---
functional:
  - Пользователь должен иметь возможность искать товары по ключевому слову или категории
  - Пользователь должен иметь возможность фильтровать товары
  - Пользователь должен иметь возможность просматривать товары и просматривать подробную информацию о товаре
  - В каталоге и на странице товара выводятся название, рейтинг, цена со скидкой и без нее
  - Каталог товаров выводится постранично
  - Пользователь должен иметь возможность добавлять товары в корзину и просматривать содержимое корзины
  - Пользователь может удалить товар из корзины
  - Из корзины пользователь может вернуться в каталог и продолжить выбирать товары
  - Из корзины пользователь может оформить заказ с переходом на страницу оплаты
  - Корзина хранится в сессии браузера
  - Пользователь должен иметь возможность переключить язык интерфейса
non-functional:
  - Сайт нужно разработать с учетом удобства использования и оптимизировать для скорости работы
  - Сайт должен быть безопасным и защищать данные пользователя
  - Сайт должен иметь мобильную версию (адаптивная верстка)
  - Сайт должен быть доступен на различных устройствах
  - Сайт нужно протестировать на совместимость с последними версиями браузеров
  - Важно, чтобы сайт мог обрабатывать большое количество трафика
  - Сайт должен иметь локализацию (перевод) на русский и английский языки
  - Сайт должен быть доступен для пользователей без использования VPN (прямой доступ из сети Интернет)
  - Сайт является SPA-приложением и не перезагружает страницу при переходах между разделами
implicit:
  - Цена со скидкой не больше цены без скидки, процент скидки соответствует разнице цен
  - Цены выводятся в денежном формате с двумя знаками после точки, без артефактов вычислений
  - Стоимость позиции в корзине равна цене со скидкой, умноженной на количество, а итоговая сумма равна сумме стоимостей позиций
  - Счетчик у ссылки на корзину показывает актуальное количество товаров в корзине
  - Корзина сохраняется при перезагрузке страницы, а удаление товаров и очистка корзины сохраняются после перезагрузки
  - Товар, которого нет в наличии, помечен как отсутствующий, и его нельзя добавить в корзину
  - Поиск и фильтры работают по всему каталогу, а не только по текущей странице
  - Поиск не зависит от регистра и игнорирует пробелы в начале и в конце запроса
  - Граничные значения диапазона цен включаются в результат фильтрации
  - Снятие фильтра расширяет выдачу, а любой фильтр можно сбросить без перезагрузки страницы
  - У всех элементов фильтров есть понятные подписи
  - Если по запросу ничего не найдено, выводится сообщение об этом
  - Если корзина пуста, выводится сообщение об этом, а оформить заказ нельзя
  - Сообщение об успешном оформлении заказа показывается только при успешном ответе сервера, иначе выводится сообщение об ошибке
  - После успешного оформления заказа корзина очищается
  - При переходе по несуществующему адресу или к несуществующему товару выводится страница с сообщением об ошибке, приложение не перестает работать
  - У каждого товара есть собственный адрес, по которому страницу товара можно открыть напрямую
  - Кнопка браузера "Назад" возвращает на предыдущую страницу приложения
  - Все ссылки ведут на существующие разделы сайта
  - Выбранный язык интерфейса сохраняется при перезагрузке страницы
  - Тексты интерфейса переведены полностью и не содержат орфографических ошибок
  - Все изображения в интерфейсе загружаются, "битых" картинок нет
  - Данные, введенные в поле поиска, не исполняются как HTML или JavaScript
  - Сайт работает по HTTPS, запросы по HTTP перенаправляются на HTTPS
