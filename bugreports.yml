---
- summary: |
    При оформлении заказа выводится сообщение "Order placed successfully", хотя сервер вернул ошибку 500
  environment: |
    https://products-store.hexlet.app/ (version 1)
    Google Chrome 156, окно 1920x1080
    ОС Linux
  steps-to-reproduce: |
    1. Открыть https://products-store.hexlet.app/
    2. Нажать "Add to cart" в карточке "Essence Mascara Lash Princess"
    3. Нажать "Cart"
    4. Открыть DevTools, вкладку Network
    5. Нажать "Checkout"
  expected-result: |
    Запрос на создание заказа завершается успешно, выводится сообщение "Order placed successfully".
    Если сервер вернул ошибку, пользователь видит сообщение об ошибке, заказ не считается оформленным
  actual-result: |
    Запрос POST https://products-store.hexlet.app/api/orders с телом {"products":[{"id":1,"quantity":1}],"total":8.943048000000001}
    возвращает статус 500 и ответ {"message":"Failed to create order","statusCode":500}.
    При этом на странице выводится окно "Order placed successfully"
    Скриншот assets/v1/checkout-500-success-modal.png

- summary: |
    При оформлении заказа нет перехода на страницу оплаты
  environment: |
    https://products-store.hexlet.app/ (version 1)
    Google Chrome 156, окно 1920x1080
    ОС Linux
  steps-to-reproduce: |
    1. Открыть https://products-store.hexlet.app/
    2. Нажать "Add to cart" в карточке "Essence Mascara Lash Princess"
    3. Нажать "Cart"
    4. Нажать "Checkout"
  expected-result: |
    Открывается страница оплаты заказа
  actual-result: |
    Открывается модальное окно "Order placed successfully" со списком товаров и суммой заказа.
    Адрес страницы остается https://products-store.hexlet.app/cart, перехода на страницу оплаты нет
    Скриншот assets/v1/checkout.png

- summary: |
    После очистки корзины кнопкой "Clear cart" и перезагрузки страницы товары возвращаются в корзину
  environment: |
    https://products-store.hexlet.app/ (version 1)
    Google Chrome 156, окно 1920x1080
    ОС Linux
  steps-to-reproduce: |
    1. Открыть https://products-store.hexlet.app/
    2. Нажать "Add to cart" в карточке "Essence Mascara Lash Princess"
    3. Нажать "Cart"
    4. Нажать "Clear cart"
    5. Перезагрузить страницу (F5)
  expected-result: |
    Корзина пуста, счетчик рядом со ссылкой "Cart" не отображается, выводится "Total: 0.00 $"
  actual-result: |
    На шаге 4 корзина на странице очищается ("Total: 0.00 $"), но после перезагрузки в корзине снова "Essence Mascara Lash Princess",
    счетчик 1, "Total: 8.94 $". В DevTools (Application > Session Storage) значение ключа cart после нажатия "Clear cart" не меняется
    Скриншоты assets/v1/clear-cart-1-cleared.png и assets/v1/clear-cart-2-after-reload.png

- summary: |
    Поиск и фильтры работают только по товарам текущей страницы каталога
  environment: |
    https://products-store.hexlet.app/ (version 1)
    Google Chrome 156, окно 1920x1080
    ОС Linux
  steps-to-reproduce: |
    1. Открыть https://products-store.hexlet.app/ (первая страница каталога)
    2. Ввести Lemon в поле "Search"
  expected-result: |
    Отображается карточка товара "Lemon"
  actual-result: |
    Выводится сообщение "Nothing found!", хотя товар "Lemon" есть на второй странице каталога.
    Если с тем же запросом нажать "Next", карточка "Lemon" появляется.
    Фильтры тоже строятся по текущей странице - на второй странице в блоке "Brand" остается только чекбокс без названия,
    а максимальная цена в блоке "Price" становится 454.8000000000001
    Скриншот assets/v1/search-other-page.png

- summary: |
    При открытии несуществующего товара отображается белый экран, приложение перестает работать
  environment: |
    https://products-store.hexlet.app/ (version 1)
    Google Chrome 156, окно 1920x1080
    ОС Linux
  steps-to-reproduce: |
    1. Перейти по адресу https://products-store.hexlet.app/products/99999
  expected-result: |
    Отображается шапка сайта и сообщение о том, что товар не найден
  actual-result: |
    Страница полностью белая, шапка и подвал не отображаются. Запрос https://products-store.hexlet.app/api/products/99999
    возвращает 404, после чего содержимое элемента #root становится пустым
    Скриншот assets/v1/product-missing-blank.png

- summary: |
    Товар, которого нет в наличии, можно добавить в корзину и оформить заказ
  environment: |
    https://products-store.hexlet.app/ (version 1)
    Google Chrome 156, окно 1920x1080
    ОС Linux
  steps-to-reproduce: |
    1. Перейти по адресу https://products-store.hexlet.app/products/117 (товар "Sportbike Motorcycle", остаток 0)
    2. Нажать "Add to cart"
    3. Нажать "Cart"
    4. Нажать "Checkout"
  expected-result: |
    На странице товара есть пометка о том, что товара нет в наличии, кнопка "Add to cart" неактивна, товар не попадает в корзину
  actual-result: |
    Пометки об отсутствии товара нет, рядом с кнопкой только число 0 без подписи. Кнопка "Add to cart" активна.
    Товар добавляется в корзину со строкой "0 qty.", заказ с ним оформляется - выводится окно "Order placed successfully"
    Скриншоты assets/v1/product-117-out-of-stock.png и assets/v1/cart-1.png

- summary: |
    Корзина не очищается после оформления заказа
  environment: |
    https://products-store.hexlet.app/ (version 1)
    Google Chrome 156, окно 1920x1080
    ОС Linux
  steps-to-reproduce: |
    1. Открыть https://products-store.hexlet.app/
    2. Нажать "Add to cart" в карточке "Essence Mascara Lash Princess"
    3. Нажать "Cart"
    4. Нажать "Checkout"
    5. В окне "Order placed successfully" нажать "Close"
  expected-result: |
    Корзина пуста, счетчик рядом со ссылкой "Cart" не отображается, выводится "Total: 0.00 $"
  actual-result: |
    В корзине остается "Essence Mascara Lash Princess", счетчик 1, "Total: 8.94 $"
    Скриншот assets/v1/cart-after-order.png

- summary: |
    Стоимость позиции и итоговая сумма в корзине не совпадают с ценами, которые видит пользователь
  environment: |
    https://products-store.hexlet.app/ (version 1)
    Google Chrome 156, окно 1920x1080
    ОС Linux
  steps-to-reproduce: |
    1. Открыть https://products-store.hexlet.app/
    2. Дважды нажать "Add to cart" в карточке "Essence Mascara Lash Princess" (цена со скидкой 8.94$)
    3. Нажать "Add to cart" в карточке "Eyeshadow Palette with Mirror" (цена со скидкой 16.35$)
    4. Нажать "Cart"
  expected-result: |
    Стоимость позиции "Essence Mascara Lash Princess" - 8.94$ x 2 = 17.88$, "Eyeshadow Palette with Mirror" - 16.35$,
    выводится "Total: 34.23 $"
  actual-result: |
    Стоимость позиции "Essence Mascara Lash Princess" - 17.89$, выводится "Total: 34.24 $".
    Стоимости считаются по неокругленным ценам (8.943048 x 2, 8.943048 + 16.353819) и округляются только в конце.
    С одной штукой каждого товара то же самое - позиции 8.94$ и 16.35$, а "Total: 25.30 $"
    Скриншот assets/v1/cart-rounding.png

- summary: |
    В карточках каталога не выводится рейтинг товара
  environment: |
    https://products-store.hexlet.app/ (version 1)
