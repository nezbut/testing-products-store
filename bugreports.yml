    Скриншоты assets/v1/catalog-fullhd.png и assets/v1/product-1.png

- summary: |
    Товары с ценой, равной границе диапазона, не попадают в результат фильтра по цене
  environment: |
    https://products-store.hexlet.app/ (version 1)
    Google Chrome 156, окно 1920x1080
    ОС Linux
  steps-to-reproduce: |
    1. Открыть https://products-store.hexlet.app/
    2. Ввести 1.49 в первое поле блока "Price"
    3. Ввести 1.99 во второе поле блока "Price"
  expected-result: |
    Отображаются карточки "Cucumber" (1.49$) и "Apple" (1.99$)
  actual-result: |
    Выводится сообщение "Nothing found!". При диапазоне от 1 до 2 оба товара отображаются, то есть границы диапазона не включаются
