- summary: |
    Мобильная версия каталога - блок фильтров сжат в узкую колонку, поле поиска выходит за его границу, значения цены обрезаны
  environment: |
    https://products-store.hexlet.app/ (version 1)
    Google Chrome 156, эмуляция iPhone 14 (390x844) в DevTools
    ОС Linux
  steps-to-reproduce: |
    1. Включить в DevTools эмуляцию устройства iPhone 14
    2. Открыть https://products-store.hexlet.app/
  expected-result: |
    Блок фильтров занимает всю ширину экрана, поле "Search" и поля блока "Price" видны полностью,
    карточки товаров имеют одинаковые отступы от краев экрана
  actual-result: |
    Блок фильтров занимает узкую колонку слева (около 90 px), правая часть экрана пустая.
    Поле "Search" выходит за границу колонки, в полях "Price" видно только "0" и "6", названия брендов переносятся по словам.
    Первая карточка товара начинается примерно через 1300 px прокрутки и прижата к левому краю экрана
    Скриншоты assets/v1/mobile-catalog.png и assets/v1/mobile-catalog-cards.png

- summary: |
    Мобильная версия корзины - обрезан текст "Checkout", количество сливается с ценой, цена со скидкой не видна
  environment: |
    https://products-store.hexlet.app/ (version 1)
    Google Chrome 156, эмуляция iPhone 14 (390x844) в DevTools
    ОС Linux
  steps-to-reproduce: |
    1. Включить в DevTools эмуляцию устройства iPhone 14
    2. Открыть https://products-store.hexlet.app/
    3. Нажать "Add to cart" в карточке "Essence Mascara Lash Princess"
    4. Перейти по адресу https://products-store.hexlet.app/cart
  expected-result: |
    Текст кнопки "Checkout" виден полностью, в строке товара видны количество 1, цена без скидки 9.99$ и цена со скидкой 8.94$
  actual-result: |
    На кнопке видно только "Checkou". Количество 1 стоит вплотную к зачеркнутой цене 9.99$ и читается как "19.99$".
    Цена со скидкой 8.94$ выходит за правый край экрана - ширина страницы 441 px при ширине экрана 390 px
    Скриншот assets/v1/mobile-cart.png
