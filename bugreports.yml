- summary: |
    При снятом флажке "In Stock" выводятся только товары, которых нет в наличии
  environment: |
    https://products-store.hexlet.app/ (version 1)
    Google Chrome 156, окно 1920x1080
    ОС Linux
  steps-to-reproduce: |
    1. Открыть https://products-store.hexlet.app/
    2. Трижды нажать "Next" - открыта четвертая страница каталога, на ней 29 карточек
    3. Снять флажок "In Stock"
  expected-result: |
    На странице отображаются все 30 товаров, включая "Sportbike Motorcycle", которого нет в наличии
  actual-result: |
    На странице остается одна карточка "Sportbike Motorcycle" с остатком 0, остальные 29 товаров скрываются.
    На первой странице, где все товары в наличии, при снятом флажке выводится "Nothing found!"
    Скриншот assets/v1/instock-unchecked.png (первая страница)

